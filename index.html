<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f4c5c"><title>Gerador de Laudos Técnicos</title><link rel="stylesheet" href="css/styles.css"><link rel="manifest" href="manifest.json"></head>
<body>
<header class="topbar no-print"><div><strong>Gerador de Laudos</strong><small>Até 5 equipamentos por OS</small></div><nav><button id="btnNovo" class="ghost">Nova OS</button><button id="btnHistorico" class="ghost">Histórico</button><button id="btnConfig" class="ghost">Configurações</button></nav></header>
<main class="layout">
<section class="panel editor no-print"><div class="section-title"><h1>Ordem de Serviço</h1><span id="saveStatus">Não salva</span></div><form id="laudoForm">
<input type="hidden" id="id"><div class="grid cols-3"><label>Número da OS<input id="numero" required></label><label>Data<input id="data" type="date" required></label><label>Hora<input id="hora" type="time" required></label></div>
<h2>Cliente</h2><div class="grid cols-2"><label>Nome / Razão social<input id="clienteNome" required></label><label>CPF / CNPJ<input id="clienteDocumento"></label><label>Telefone<input id="clienteTelefone"></label><label>E-mail<input id="clienteEmail" type="email"></label><label class="span-2">Endereço<input id="clienteEndereco"></label></div>
<div class="equipment-title"><h2>Equipamentos</h2><button type="button" id="btnAddEquip">+ Adicionar equipamento</button></div><div id="equipmentTabs" class="tabs"></div><div id="equipmentEditor"></div>
<div class="actions sticky-actions"><button type="submit">Salvar OS</button><button type="button" id="btnTxt">Salvar TXT</button><button type="button" id="btnPdf" class="primary">Gerar PDF</button><button type="button" id="btnPrint">Imprimir</button><button type="button" id="btnPdfEmail">PDF + preparar e-mail</button></div></form></section>
<section class="preview-wrap"><div class="preview-toolbar no-print"><strong>Pré-visualização</strong><small>Uma página por equipamento + relatório final</small></div><div id="documentPages" class="document-pages"></div></section>
</main>
<dialog id="historicoDialog"><div class="dialog-head"><h2>OS salvas</h2><button data-close="historicoDialog">×</button></div><input id="busca" placeholder="Buscar por OS, cliente ou equipamento"><div id="historicoLista"></div></dialog>
<dialog id="configDialog"><div class="dialog-head"><h2>Configurações</h2><button data-close="configDialog">×</button></div><form id="configForm"><label>Logomarca<input id="logoInput" type="file" accept="image/*"></label><div class="grid cols-2"><label>Empresa / profissional<input id="empresaNome"></label><label>CPF / CNPJ<input id="empresaDocumento"></label><label>Telefone<input id="empresaTelefone"></label><label>E-mail<input id="empresaEmail" type="email" value="fsbatepap@gmail.com"></label><label class="span-2">Endereço<input id="empresaEndereco"></label><label>Posição da logo<select id="logoPosicao"><option value="left">Esquerda</option><option value="right">Direita</option></select></label><label>Marca d'água<input id="marcaAgua" value="DOCUMENTO ORIGINAL"></label></div><div class="actions"><button type="submit">Salvar configurações</button></div></form><hr><h3>Backup</h3><div class="actions"><button id="btnExportar" type="button">Exportar backup</button><label class="file-button">Importar backup<input id="importarArquivo" type="file" accept="application/json,.json,.bkp"></label></div></dialog>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module" src="js/app.js"></script></body></html>
